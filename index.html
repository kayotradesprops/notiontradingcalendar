<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Today's Economic Calendar</title>
  <style>
    :root{
      --bg:#191919; --card:#242424; --card2:#2b2b2b; --line:#3a3a3a;
      --text:#f2f2f2; --muted:#a7a7a7; --subtle:#777;
      --high:#e25555; --med:#e0a33d; --low:#909090;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:transparent;color:var(--text);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .widget{
      width:100%; min-height:100vh; background:var(--bg);
      border:1px solid var(--line); border-radius:16px; overflow:hidden;
      box-shadow:0 12px 36px rgba(0,0,0,.18);
    }
    .header{
      display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
      padding:20px 22px 14px;border-bottom:1px solid var(--line);
    }
    .title{
      font-family:ui-serif,Georgia,"Times New Roman",serif;
      font-size:25px;line-height:1.05;font-weight:700;margin:0 0 7px;
    }
    .subtitle{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
    .live{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);white-space:nowrap;margin-top:3px}
    .live-dot{width:7px;height:7px;border-radius:50%;background:#54b56f;box-shadow:0 0 0 4px rgba(84,181,111,.08)}
    .live-dot.off{background:#888;box-shadow:none}
    .controls{display:flex;flex-wrap:wrap;gap:7px;padding:12px 22px;border-bottom:1px solid var(--line)}
    button,.chip{
      border:1px solid var(--line);background:var(--card);color:var(--muted);
      border-radius:999px;font-size:11px;padding:7px 10px;cursor:pointer;transition:.15s ease;
    }
    button:hover,.chip:hover{background:var(--card2);color:var(--text)}
    .chip.active{background:#343434;color:var(--text);border-color:#4a4a4a}
    .calendar{padding:6px 0 0}
    .head,.row{
      display:grid;grid-template-columns:82px 70px minmax(170px,1fr) 82px 82px 82px;
      align-items:center;gap:8px;padding:10px 22px;
    }
    .head{
      color:var(--subtle);font-size:10px;letter-spacing:.85px;text-transform:uppercase;
      border-bottom:1px solid var(--line);
    }
    .row{min-height:56px;border-bottom:1px solid rgba(58,58,58,.72);font-size:13px}
    .row:last-child{border-bottom:0}
    .row.next{background:linear-gradient(90deg,rgba(255,255,255,.035),transparent 70%)}
    .time{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
    .impact-wrap{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}
    .impact-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
    .impact-high{background:var(--high)} .impact-medium{background:var(--med)} .impact-low{background:var(--low)}
    .event-title{font-weight:600;line-height:1.28;overflow:hidden;text-overflow:ellipsis}
    .number{text-align:right;color:#d7d7d7;font-variant-numeric:tabular-nums}
    .actual.released{color:var(--text);font-weight:750}
    .summary{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;
      padding:14px 22px 16px;border-top:1px solid var(--line);background:#1d1d1d;
    }
    .summary-card{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:12px 13px;min-height:64px}
    .summary-label{color:var(--muted);text-transform:uppercase;letter-spacing:.75px;font-size:9px;margin-bottom:6px}
    .summary-value{font-size:13px;line-height:1.3;font-weight:650}
    .footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 22px 16px;color:var(--subtle);font-size:10px}
    .footer a{color:#cfcfcf;text-decoration:none;font-size:11px;border-bottom:1px solid #555;padding-bottom:1px}
    .empty,.error{padding:30px 22px;color:var(--muted);font-size:13px;text-align:center}
    .spinner{display:inline-block;width:12px;height:12px;border:2px solid #4b4b4b;border-top-color:#bdbdbd;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:7px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:640px){
      .header{padding:16px 16px 12px}.controls{padding:10px 16px}.head{display:none}
      .row{grid-template-columns:72px 1fr 62px 62px;grid-template-areas:"time event forecast previous" "impact event actual actual";gap:4px 10px;padding:11px 16px}
      .time{grid-area:time}.impact-wrap{grid-area:impact}.event-title{grid-area:event}
      .actual{grid-area:actual}.forecast{grid-area:forecast}.previous{grid-area:previous}
      .number:before{display:block;color:var(--subtle);font-size:8px;text-transform:uppercase;letter-spacing:.5px}
      .actual:before{content:"Actual"}.forecast:before{content:"Forecast"}.previous:before{content:"Previous"}
      .summary{grid-template-columns:1fr;padding:12px 16px 14px}.footer{padding:10px 16px 14px}
    }
  </style>
</head>
<body>
<section class="widget">
  <header class="header">
    <div>
      <h1 class="title">Today’s Economic Calendar</h1>
      <div class="subtitle" id="dateLabel">Loading…</div>
    </div>
    <div class="live"><span id="liveDot" class="live-dot"></span><span id="statusText">CONNECTING</span></div>
  </header>

  <div class="controls">
    <span class="chip active">USD ONLY</span>
    <button class="chip active impact-filter" data-impact="High">High</button>
    <button class="chip active impact-filter" data-impact="Medium">Medium</button>
    <button class="chip impact-filter" data-impact="Low">Low</button>
    <button id="tzBtn" class="chip active">ET</button>
    <button id="refreshBtn" class="chip">Refresh</button>
  </div>

  <div class="calendar">
    <div class="head">
      <div>Time</div><div>Impact</div><div>Event</div>
      <div style="text-align:right">Actual</div>
      <div style="text-align:right">Forecast</div>
      <div style="text-align:right">Previous</div>
    </div>
    <div id="rows"><div class="empty"><span class="spinner"></span>Loading calendar…</div></div>
  </div>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-label">NYAM Risk Window</div>
      <div class="summary-value" id="riskWindow">Checking today’s events…</div>
    </div>
    <div class="summary-card">
      <div class="summary-label">Next Relevant Event</div>
      <div class="summary-value" id="nextEvent">Checking…</div>
    </div>
  </div>

  <footer class="footer">
    <span id="updated">Myfxbook calendar • connecting…</span>
    <a href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener">Open Forex Factory ↗</a>
  </footer>
</section>

<script>
(() => {
  const state={timezone:"America/New_York",timezoneLabel:"ET",impacts:new Set(["High","Medium"]),events:[]};
  const el=id=>document.getElementById(id);

  function dateKey(date,tz){
    const p=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
    const o={}; for(const x of p)o[x.type]=x.value;
    return `${o.year}-${o.month}-${o.day}`;
  }
  function fmtDate(){
    return new Intl.DateTimeFormat("en-US",{timeZone:state.timezone,weekday:"long",month:"long",day:"numeric",year:"numeric"}).format(new Date())
      + ` • USD • ${state.timezoneLabel}`;
  }
  function fmtTime(date){
    return new Intl.DateTimeFormat("en-US",{timeZone:state.timezone,hour:"numeric",minute:"2-digit",hour12:true}).format(date);
  }
  function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
  function impactClass(v){return v==="High"?"impact-high":v==="Medium"?"impact-medium":"impact-low"}

  function todays(){
    const today=dateKey(new Date(),state.timezone);
    return state.events
      .filter(e=>e.country==="USD")
      .filter(e=>state.impacts.has(e.impact))
      .filter(e=>dateKey(new Date(e.date),state.timezone)===today)
      .sort((a,b)=>new Date(a.date)-new Date(b.date));
  }
  function getNext(events){
    const now=new Date();
    const f=events.filter(e=>new Date(e.date)>=now);
    return f.find(e=>e.impact==="High")||f.find(e=>e.impact==="Medium")||f[0]||null;
  }
  function render(){
    el("dateLabel").textContent=fmtDate();
    const events=todays();
    if(!events.length){
      el("rows").innerHTML='<div class="empty">No USD events match your filters today.</div>';
      el("riskWindow").textContent="No remaining high/medium-impact USD window";
      el("nextEvent").textContent="No remaining matching event";
      return;
    }
    const next=getNext(events);
    el("rows").innerHTML=events.map(e=>{
      const d=new Date(e.date);
      return `<div class="row ${next&&e.id===next.id?"next":""}">
        <div class="time">${esc(fmtTime(d))}</div>
        <div class="impact-wrap"><span class="impact-dot ${impactClass(e.impact)}"></span><span>${esc(e.impact)}</span></div>
        <div class="event-title">${esc(e.title)}</div>
        <div class="number actual ${e.actual?"released":""}">${esc(e.actual||"—")}</div>
        <div class="number forecast">${esc(e.forecast||"—")}</div>
        <div class="number previous">${esc(e.previous||"—")}</div>
      </div>`;
    }).join("");

    const now=new Date();
    const risk=events.filter(e=>new Date(e.date)>=now).find(e=>e.impact==="High"||e.impact==="Medium");
    if(risk){
      const d=new Date(risk.date),b=new Date(d.getTime()-5*60000),a=new Date(d.getTime()+5*60000);
      el("riskWindow").textContent=`${fmtTime(b)} – ${fmtTime(a)} • ${risk.title}`;
    }else el("riskWindow").textContent="No remaining high/medium-impact USD window";
    el("nextEvent").textContent=next?`${fmtTime(new Date(next.date))} • ${next.title}`:"No remaining matching event";
  }

  async function load(){
    el("statusText").textContent="UPDATING";
    try{
      const r=await fetch("/api/calendar?t="+Date.now(),{cache:"no-store"});
      const data=await r.json();
      if(!r.ok)throw new Error(data.error||"Calendar API failed");
      state.events=data.events||[];
      const live=Boolean(data.live);
      el("statusText").textContent=live?"LIVE":"SCHEDULE";
      el("liveDot").classList.toggle("off",!live);
      const stamp=new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"}).format(new Date());
      el("updated").textContent=`${data.source||"Calendar"} • refreshed ${stamp}`;
      render();
    }catch(err){
      el("statusText").textContent="OFFLINE";
      el("liveDot").classList.add("off");
      el("rows").innerHTML=`<div class="error">${esc(err.message||"Calendar unavailable")}</div>`;
      el("riskWindow").textContent="Unavailable"; el("nextEvent").textContent="Unavailable";
    }
  }

  document.querySelectorAll(".impact-filter").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const i=btn.dataset.impact;
      if(state.impacts.has(i)){state.impacts.delete(i);btn.classList.remove("active")}
      else{state.impacts.add(i);btn.classList.add("active")}
      render();
    });
  });
  el("tzBtn").addEventListener("click",()=>{
    if(state.timezone==="America/New_York"){state.timezone="America/Chicago";state.timezoneLabel="CT"}
    else{state.timezone="America/New_York";state.timezoneLabel="ET"}
    el("tzBtn").textContent=state.timezoneLabel;render();
  });
  el("refreshBtn").addEventListener("click",load);

  load();
  setInterval(load,30000);
})();
</script>
</body>
</html>
