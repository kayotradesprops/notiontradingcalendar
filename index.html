<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NYAM News & Risk</title>
  <style>
    :root{
      --bg:#191919;
      --line:#393939;
      --text:#f1f1f1;
      --muted:#a8a8a8;
      --card:#242424;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      background:transparent;
      color:var(--text);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .shell{
      width:100%;
      background:var(--bg);
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      padding:18px 20px 13px;
      border-bottom:1px solid var(--line);
    }
    .title{
      margin:0 0 5px;
      font-family:ui-serif,Georgia,"Times New Roman",serif;
      font-size:25px;
      line-height:1.05;
    }
    .subtitle{
      color:var(--muted);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.9px;
    }
    .live{
      display:flex;
      align-items:center;
      gap:7px;
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
      margin-top:3px;
    }
    .dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:#55b66e;
      box-shadow:0 0 0 4px rgba(85,182,110,.08);
    }
    .bar{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      align-items:center;
      padding:10px 20px;
      border-bottom:1px solid var(--line);
    }
    .chip,button{
      border:1px solid var(--line);
      background:var(--card);
      color:var(--text);
      border-radius:999px;
      padding:7px 10px;
      font-size:11px;
    }
    button{cursor:pointer}
    .muted{color:var(--muted)}
    .calendar{
      height:650px;
      min-height:520px;
      background:#131722;
    }
    .tradingview-widget-container,
    .tradingview-widget-container__widget{
      width:100%;
      height:100%;
    }
    .footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:10px 20px 13px;
      color:var(--muted);
      font-size:10px;
      border-top:1px solid var(--line);
    }
    .footer a{
      color:#d0d0d0;
      text-decoration:none;
      border-bottom:1px solid #555;
    }
    @media(max-width:640px){
      .top{padding:15px 15px 11px}
      .bar{padding:9px 15px}
      .calendar{height:680px}
      .footer{padding:10px 15px 13px}
    }
  </style>
</head>
<body>
  <section class="shell">
    <header class="top">
      <div>
        <h1 class="title">NYAM News & Risk</h1>
        <div class="subtitle">US economic calendar • Actual / Forecast / Previous</div>
      </div>
      <div class="live"><span class="dot"></span><span>LIVE DATA</span></div>
    </header>

    <div class="bar">
      <span class="chip">US / USD</span>
      <span class="chip">HIGH + MEDIUM</span>
      <span class="chip muted">LOW OFF</span>
      <button onclick="location.reload()">REFRESH</button>
    </div>

    <div class="calendar">
      <!-- TradingView Widget BEGIN -->
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script
          type="text/javascript"
          src="https://s3.tradingview.com/external-embedding/embed-widget-events.js"
          async>
        {
          "colorTheme": "dark",
          "isTransparent": false,
          "locale": "en",
          "countryFilter": "us",
          "importanceFilter": "0,1",
          "width": "100%",
          "height": "100%"
        }
        </script>
      </div>
      <!-- TradingView Widget END -->
    </div>

    <footer class="footer">
      <span>TradingView Economic Calendar • Low impact hidden by default</span>
      <a href="https://www.forexfactory.com/calendar" target="_blank" rel="noopener">Open Forex Factory ↗</a>
    </footer>
  </section>
</body>
</html>
